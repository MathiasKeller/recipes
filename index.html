<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Book</title>
<meta name="description" content="Personal recipe collection with metric and original measurements.">
<meta name="theme-color" content="#003f4f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23003f4f'/%3E%3Cpath d='M16 40c0-9 7-16 16-16s16 7 16 16H16z' fill='%2300cfcf'/%3E%3Crect x='12' y='40' width='40' height='5' rx='2.5' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem("rb-theme"));if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{
  --scale:1;
  --bg:#ffffff;
  --surface:#f2f9fa;
  --surface-2:#e4f3f5;
  --ink:#0f2a31;
  --muted:#4b6268;
  --line:#d3e5e8;
  --deep:#003f4f;
  --teal:#006f7f;
  --lagoon:#009faf;
  --aqua:#00cfcf;
  --cyan:#00ffff;
  --link:#006f7f;
  --on-deep:#ffffff;
  --done:#8aa2a7;
  --c-breakfast:#00cfcf;
  --c-starters:#009faf;
  --c-mains:#006f7f;
  --c-desserts:#003f4f;
  --bar-h:3.5rem;
  --radius-s:6px;
  --radius-m:12px;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06191e;
    --surface:#0b262d;
    --surface-2:#103540;
    --ink:#e9f5f6;
    --muted:#a3bfc4;
    --line:#1c444e;
    --link:#5fe3e3;
    --done:#5f7c82;
    --c-desserts:#3d8ea0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#06191e;
    --surface:#0b262d;
    --surface-2:#103540;
    --ink:#e9f5f6;
    --muted:#a3bfc4;
    --line:#1c444e;
    --link:#5fe3e3;
    --done:#5f7c82;
    --c-desserts:#3d8ea0;
    color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(106.25% * var(--scale));-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--link);text-underline-offset:.18em}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px;border-radius:4px}
.wrap{max-width:62rem;margin:0 auto;padding:0 1rem}
.narrow{max-width:46rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--deep);color:var(--on-deep);padding-top:env(safe-area-inset-top)}
.appbar .wrap{height:var(--bar-h);display:flex;align-items:center;gap:.5rem}
.brand{display:flex;align-items:center;gap:.6rem;color:inherit;text-decoration:none;font-family:var(--display);font-weight:650;font-size:1.25rem;letter-spacing:-.01em;min-width:0}
.brand svg{flex:none}
.appbar .spacer{display:block!important}
:root{--title-h:0rem}
:root.title-on{--title-h:1.75rem}
.title-row{height:var(--title-h);overflow:hidden;transition:height .2s ease}
.title-row .wrap{height:1.75rem;display:flex;align-items:flex-start}
.bar-title{flex:1;min-width:0;padding:0 .2rem;font-family:var(--body);font-weight:700;font-size:.82rem;letter-spacing:.01em;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--aqua);opacity:0;transition:opacity .2s}
.bar-title.show{opacity:1}
.spacer{flex:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-width:2.6rem;height:2.6rem;padding:0 .6rem;border:0;border-radius:999px;background:transparent;color:var(--on-deep);cursor:pointer;font-weight:700}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn[aria-pressed="true"]{background:var(--aqua);color:var(--deep)}
.icon-btn:disabled{opacity:.4;cursor:default}
#themeBtn .ico-sun{display:none}
#themeBtn.is-dark .ico-sun{display:block}
#themeBtn.is-dark .ico-moon{display:none}
.size-group{display:flex;align-items:center;border:1px solid rgba(255,255,255,.28);border-radius:999px}
.size-group .icon-btn{min-width:2.4rem;height:2.4rem;padding:0 .5rem}
.size-group .sm{font-size:.8rem}
.size-group .lg{font-size:1.1rem}
.back{padding-left:.3rem;padding-right:.8rem;text-decoration:none}
.wake-label{font-size:.85rem}
@media (max-width:30rem){.wake-label{display:none}}

/* ---------- Overview ---------- */
.intro{padding-top:2rem;padding-bottom:1.25rem}
.intro h1{font-family:var(--display);font-weight:650;font-size:clamp(2rem,6vw,3rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 .5rem;color:var(--ink)}
.intro p{margin:0;color:var(--muted);max-width:38rem}
.findbar{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top));z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:.75rem 0 .6rem}
.search{position:relative}
.search svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:3rem;padding:0 2.8rem 0 2.75rem;border:2px solid var(--line);border-radius:var(--radius-m);background:var(--surface);font-size:1rem}
.search input:focus{outline:none;border-color:var(--teal);background:var(--bg)}
.search .clear{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:2.3rem;height:2.3rem;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;display:none}
.search.has-text .clear{display:inline-flex;align-items:center;justify-content:center}
.chiprow{display:flex;gap:.5rem;overflow-x:auto;padding:.65rem 0 .1rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.jump{flex:none;display:inline-flex;align-items:center;gap:.5rem;height:2.4rem;padding:0 .95rem 0 .7rem;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font-weight:700;font-size:.92rem;cursor:pointer;white-space:nowrap}
.jump:hover{border-color:var(--teal)}
.jump .dot{width:.75rem;height:.75rem;border-radius:50%;background:var(--c)}
.jump .n{color:var(--muted);font-weight:400}
.jump:disabled{opacity:.45;cursor:default}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:1rem 0 .25rem}
.filters .lbl{color:var(--muted);font-size:.92rem;margin-right:.15rem}
.fchip{display:inline-flex;align-items:center;gap:.4rem;height:2.4rem;padding:0 .95rem;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);color:var(--ink);font-size:.92rem;cursor:pointer}
.fchip svg{display:none}
.fchip-quick{margin-left:.6rem}
.fchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.fchip[aria-pressed="true"] svg{display:block}
.reset{border:0;background:none;color:var(--link);text-decoration:underline;cursor:pointer;padding:.4rem;font-size:.92rem}
.course{padding-top:1.75rem;scroll-margin-top:9rem}
.course-head{display:flex;align-items:baseline;gap:.75rem;margin:0 0 .9rem;padding-bottom:.55rem;border-bottom:4px solid var(--c)}
.course-head h2{font-family:var(--display);font-weight:650;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.course-head .n{color:var(--muted);font-size:.95rem}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:.75rem;grid-template-columns:1fr}
@media (min-width:44rem){.cards{grid-template-columns:1fr 1fr}}
.card{display:block;height:100%;padding:1rem 1.1rem 1rem 1.25rem;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--radius-s) var(--radius-m) var(--radius-m) var(--radius-s);background:var(--bg);color:var(--ink);text-decoration:none}
.card:hover{background:var(--surface)}
.card h3{font-family:var(--display);font-weight:650;font-size:1.25rem;line-height:1.25;margin:0;color:var(--ink)}
.card .sub{color:var(--muted);font-size:.95rem;margin:.1rem 0 0}
.card .facts{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin:.65rem 0 0;padding:0;list-style:none;font-size:.85rem}
.card .facts li{padding:.1rem .55rem;border-radius:var(--radius-s);background:var(--surface-2);color:var(--ink)}
.card .hit{margin:.55rem 0 0;font-size:.88rem;color:var(--muted)}
.card mark,.hit mark{background:color-mix(in srgb,var(--cyan) 45%,transparent);color:inherit;border-radius:3px;padding:0 .1em}
.empty{padding:3rem 0;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:.35rem}
.foot{padding:3rem 0 4rem;color:var(--muted);font-size:.88rem}

/* ---------- Recipe ---------- */
.r-head{padding:1.5rem 0 1rem;border-bottom:4px solid var(--c)}
.r-course{display:inline-flex;align-items:center;gap:.45rem;font-size:.92rem;color:var(--muted);margin:0 0 .35rem}
.r-course .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.r-head h1{font-family:var(--display);font-weight:650;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.08;letter-spacing:-.02em;margin:0}
.r-head .sub{margin:.3rem 0 0;color:var(--muted);font-size:1.05rem}
.r-facts{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;margin:1rem 0 0;padding:0}
.r-facts li{display:flex;flex-direction:column;padding:.4rem .75rem;border-radius:var(--radius-s);background:var(--surface);min-width:5.5rem}
.r-facts .k{font-size:.78rem;color:var(--muted)}
.r-facts .v{font-weight:700}
.r-source{margin:.9rem 0 0;font-size:.92rem;color:var(--muted)}
.r-source .note{display:block;margin-top:.2rem;font-style:italic}
.tabs{position:sticky;top:calc(var(--bar-h) + var(--title-h) + env(safe-area-inset-top));z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:.25rem}
.tab{flex:1;max-width:11rem;height:3.1rem;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-weight:700;cursor:pointer;font-size:1rem}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.r-sec{padding-top:1.5rem;scroll-margin-top:calc(var(--bar-h) + 1.75rem + 3.4rem + env(safe-area-inset-top))}
.r-sec > h2{font-family:var(--display);font-weight:650;font-size:1.5rem;margin:0 0 .25rem}
.scaler{display:flex;align-items:center;gap:.5rem;margin:0 0 .6rem;flex-wrap:wrap}
.scaler .lbl{font-weight:700;margin-right:.25rem}
.sc-btn{width:2.4rem;height:2.4rem;border:2px solid var(--teal);border-radius:999px;background:var(--bg);color:var(--teal);font-size:1.3rem;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.sc-btn:disabled{opacity:.35;cursor:default}
.sc-val{min-width:3.4rem;text-align:center;font-weight:700;font-size:1.1rem;padding:.2rem .6rem;border-radius:var(--radius-s);background:var(--surface-2);font-variant-numeric:tabular-nums}
.sc-reset{border:0;background:none;color:var(--link);text-decoration:underline;cursor:pointer;font-size:.9rem;padding:.3rem}
#recipe.scaled .amt{background:color-mix(in srgb,var(--cyan) 25%,transparent);border-radius:3px;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sc-note{font-size:.85rem;color:var(--teal);margin:0 0 .6rem}
.star{color:#e0a000;margin-right:.3em}
.rate-chip{display:inline-flex;align-items:baseline}
.rate-chip b{font-weight:700}
.rate-chip .of,.f-rate .of{color:var(--muted);font-weight:400}
.card .facts li.is-rate{background:transparent;border:1px solid var(--line)}
.card.has-thumb{position:relative;padding-right:7.6rem;min-height:7.8rem}
.card .thumb{position:absolute;right:.75rem;top:.75rem;width:6.2rem;height:6.2rem;object-fit:cover;border-radius:var(--radius-m)}
.hero{margin:.25rem -1rem 1.1rem}
.hero .ph{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.hero img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
@media (min-width:44rem){.hero{margin:1rem 0 1.2rem}.hero img{border-radius:var(--radius-m);aspect-ratio:16/9}}
.hero figcaption{font-size:.82rem;color:var(--muted);padding:.4rem 1rem 0}
.more-ph{display:flex;gap:.5rem;overflow-x:auto;margin:-.5rem 0 1rem;scrollbar-width:none}
.more-ph::-webkit-scrollbar{display:none}
.more-ph .ph{flex:none;padding:0;border:0;background:none;cursor:zoom-in}
.more-ph img{display:block;width:4.5rem;height:4.5rem;object-fit:cover;border-radius:var(--radius-s)}
.r-facts li.f-rate{background:var(--bg);border:1px solid var(--line)}
.r-verdict{margin:.75rem 0 0;padding:.1rem 0 .1rem .85rem;border-left:3px solid var(--teal);font-style:italic;line-height:1.5}
.r-verdict .d{display:block;font-style:normal;font-size:.82rem;color:var(--muted);margin-top:.15rem}
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:1rem}
.lb img{max-width:100%;max-height:100%;border-radius:var(--radius-s)}
.lb-x{position:absolute;top:calc(.75rem + env(safe-area-inset-top));right:.75rem;width:2.6rem;height:2.6rem;border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-size:1.1rem;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:.25rem 1rem;font-size:.85rem;color:var(--muted);margin:0 0 .75rem}
.legend b{color:var(--ink)}
.tip{font-size:.85rem;color:var(--muted);margin:0 0 .75rem}
.grp{margin:1.1rem 0 .4rem;font-size:1.05rem;font-weight:700;color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grp{color:var(--aqua)}}
:root[data-theme="dark"] .grp{color:var(--aqua)}
.ing{list-style:none;margin:0;padding:0}
.ing{display:flex;flex-direction:column;gap:.5rem}
.ing li{display:flex;align-items:flex-start;gap:.8rem;padding:.75rem .85rem;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--bg);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s}
.ing li:hover{border-color:var(--lagoon)}
.ing .box{flex:none;width:1.45rem;height:1.45rem;margin-top:.12rem;border:2px solid var(--teal);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.ing .body{flex:1;min-width:0;line-height:1.45}
.q{display:inline-flex;align-items:baseline;gap:.4rem;margin:0 .45rem .15rem 0;padding:.05rem .55rem;border-radius:var(--radius-s);background:var(--surface-2);line-height:1.5;vertical-align:baseline}
.q .m{font-weight:700;font-variant-numeric:tabular-nums}
.q .o{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ing .x{color:var(--muted)}
.ing .l{display:block;font-size:.85rem;color:var(--muted);font-style:italic}
.ing li.done{background:var(--surface);border-color:transparent}
.ing li.done .box{background:var(--teal);border-color:var(--teal)}
.ing li.done .box::after{content:"";width:.4rem;height:.75rem;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.ing li.done .q{background:transparent}
.ing li.done .m,.ing li.done .name{text-decoration:line-through;text-decoration-thickness:2px;color:var(--done)}
.ing li.done .o,.ing li.done .x,.ing li.done .l{color:var(--done)}
.e{font-style:normal;margin-right:.35em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.cnt{font-family:var(--body);font-size:.85rem;font-weight:700;color:var(--muted);background:var(--surface-2);padding:.1rem .55rem;border-radius:999px;vertical-align:middle;margin-left:.3rem}
.card .tags{display:flex;flex-wrap:wrap;gap:.35rem;margin:.55rem 0 0;padding:0;list-style:none;font-size:.82rem}
.card .tags li{padding:.05rem .55rem;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.course-head h2 .e{margin-right:.3em}
.r-course .e,.jump .e,.fchip .e{margin-right:0}
.tab{white-space:nowrap;max-width:none}
.tab .e{margin-right:.3em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ing .box{border-color:var(--lagoon)}}
:root[data-theme="dark"] .ing .box{border-color:var(--lagoon)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:.85rem .5rem .85rem 3.1rem;border-bottom:1px solid var(--line);counter-increment:s;cursor:pointer;border-radius:4px;max-width:42rem;-webkit-tap-highlight-color:transparent}
.steps li:hover{background:var(--surface)}
.steps li::before{content:counter(s);position:absolute;left:.4rem;top:.8rem;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--surface-2);color:var(--ink);font-weight:700;font-size:.92rem;display:flex;align-items:center;justify-content:center}
.steps li.done{color:var(--done)}
.steps li.done::before{content:"✓";background:var(--teal);color:#fff}
.orig{color:var(--muted)}
.steps li.done .orig{color:var(--done)}
.notes{margin:0;padding-left:1.2rem;max-width:42rem}
.notes li{margin:.5rem 0}
.conv{margin:1.5rem 0 0;padding:.9rem 1rem;border-radius:var(--radius-s);background:var(--surface);font-size:.88rem;color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:2.5rem 0 4rem}
.pager a{display:block;padding:.9rem 1rem;border:1px solid var(--line);border-radius:var(--radius-m);text-decoration:none;color:var(--ink)}
.pager a:hover{background:var(--surface)}
.pager .k{display:block;font-size:.82rem;color:var(--muted)}
.pager .t{font-family:var(--display);font-weight:650}
.pager .next{text-align:right;grid-column:2}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom));transform:translate(-50%,1rem);background:var(--deep);color:#fff;padding:.6rem 1rem;border-radius:999px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 2rem);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.show.has-action{pointer-events:auto}
.toast-act{margin-left:.6rem;border:0;border-radius:999px;padding:.25rem .75rem;background:var(--aqua);color:var(--deep);font-weight:700;cursor:pointer}
.clr-btn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:.35rem;height:3.1rem;padding:0 .5rem;border:0;background:none;color:var(--muted);font-weight:700;font-size:.9rem;cursor:pointer}
.clr-btn:hover{color:var(--ink)}
@media (max-width:30rem){.clr-label{display:none}}
[hidden]{display:none!important}
@media print{
  .appbar,.findbar,.filters,.tabs,.pager,.toast,.clr-btn,.scaler,.sc-note{display:none!important}
  .ing li,.steps li{break-inside:avoid}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="wrap">
    <a class="brand" href="#/" id="brand" aria-label="Recipe Book, all recipes">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 40c0-11 9-20 20-20s20 9 20 20H12z" fill="#00cfcf"/><rect x="8" y="40" width="48" height="6" rx="3" fill="#fff"/><circle cx="32" cy="16" r="3.5" fill="#fff"/></svg>
      <span>Recipe Book</span>
    </a>
    <a class="icon-btn back" href="#/" id="back" hidden aria-label="Back to all recipes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span>All</span>
    </a>
    <div class="spacer" id="spacer"></div>
    <button class="icon-btn" id="wakeBtn" type="button" aria-pressed="false" hidden title="Keep the screen on while cooking">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
      <span class="wake-label" id="wakeLabel">Screen on</span>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// {metric|original} renders as "metric / original"; {150 g} renders as "150 g".
// When scale is on, pairs whose metric side is a weight or volume, and all {single} markers,
// become .amt spans that the amount scaler updates. Temperatures, lengths and sizes never scale.
const AMT_RE = /\d\s*(g|kg|ml|l)\b/;
const amtSpan = v => `<span class="amt" data-raw="${v}">${v}</span>`;
const fmt = (s, scale = true) => esc(s).replace(/\{([^|{}]+)(?:\|([^{}]+))?\}/g, (_, m, o) => {
  if (o === undefined) return scale ? amtSpan(m) : m;
  return scale && AMT_RE.test(m) && !m.includes("°")
    ? `${amtSpan(m)} <span class="orig">/ ${amtSpan(o)}</span>`
    : `${m} <span class="orig">/ ${o}</span>`;
});
const plain = s => String(s).replace(/\{([^|{}]+)(?:\|[^{}]+)?\}/g, "$1");
const FACT_E = {Serves:"🍽️",Makes:"🍽️",Yield:"🍽️",Prep:"🔪",Cook:"🔥",Bake:"♨️",Total:"⏱️",Pan:"🍳",Mould:"🧁",Oven:"🌡️",Equipment:"🥣"};
const em = e => `<span class="e" aria-hidden="true">${e}</span>`;

const STAR = `<span class="star" aria-hidden="true">★</span>`;

    ${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ""}</figure>`;
}

  if (!r.photos || r.photos.length < 2) return "";
  return `<div class="more-ph">${r.photos.slice(1).map(p => `<button type="button" class="ph" data-src="${p.src}" aria-label="Enlarge photo${p.caption ? ": " + esc(p.caption) : ""}"><img src="${p.src}" alt="${esc(p.alt || p.caption || "Another photo of " + r.title)}" loading="lazy"></button>`).join("")}</div>`;
}
const courseOf = id => COURSES.find(c => c.id === id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  JSON.stringify([r.method, r.notes || [], r.facts]).includes("|");
const totalMinutes = r => {
  let t = 0;
  r.facts.forEach(([k, v]) => {
    if (!/^(Prep|Cook|Bake)$/.test(k)) return;
    const h = /(\d+)\s*hr/.exec(v), m = /(\d+)\s*min/.exec(v);
    t += (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);
  });
  return t;
};
function timeLabel(r){
  const total = r.facts.find(f => f[0] === "Total");

let toastTimer;
function toast(msg, action){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.toggle("has-action", !!action);
  if (action){
    const b = document.createElement("button");
    b.type = "button"; b.className = "toast-act"; b.textContent = action.label;
    b.addEventListener("click", () => { clearTimeout(toastTimer); el.classList.remove("show", "has-action"); action.fn(); });

  }
  el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show", "has-action"), action ? 5000 : 2200);
}
function scrollToEl(el, stickyEls){
  const offset = stickyEls.reduce((a, s) => a + (s ? s.offsetHeight : 0), 0) + 8;
  const top = el.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({top, behavior: reduceMotion() ? "auto" : "smooth"});

const SIZES = [0.9, 1, 1.12, 1.25, 1.4, 1.6];
let sizeIdx = store.get("rb-size", 1);

function applySize(announce){
  document.documentElement.style.setProperty("--scale", SIZES[sizeIdx]);
  $("#sizeDown").disabled = sizeIdx === 0;
  $("#sizeUp").disabled = sizeIdx === SIZES.length - 1;
  store.set("rb-size", sizeIdx);
  if (announce) toast(`Text size ${Math.round(SIZES[sizeIdx] * 100)}%`);
}
$("#sizeDown").addEventListener("click", () => { if (sizeIdx > 0){ sizeIdx--; applySize(true); } });
$("#sizeUp").addEventListener("click", () => { if (sizeIdx < SIZES.length - 1){ sizeIdx++; applySize(true); } });
applySize(false);

/* ------------------------------------------------------------------
   LIGHT / DARK MODE (follows the system until the toggle is used)
------------------------------------------------------------------- */
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : darkQuery.matches;
};
function syncThemeBtn(){
  const dark = isDark(), label = dark ? "Switch to light mode" : "Switch to dark mode";
  const b = $("#themeBtn");
  b.classList.toggle("is-dark", dark);
  b.setAttribute("aria-label", label);
  b.title = label;
}
$("#themeBtn").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store.set("rb-theme", next);
  syncThemeBtn();
  toast(next === "dark" ? "Dark mode" : "Light mode");
});
if (darkQuery.addEventListener) darkQuery.addEventListener("change", syncThemeBtn);
syncThemeBtn();

/* ------------------------------------------------------------------

------------------------------------------------------------------- */
const wake = {
  supported: "wakeLock" in navigator,
  want: store.get("rb-wake", true),
  lock: null,
  active: false, // true while a recipe is open
  async acquire(){
    if (!this.supported || !this.want || !this.active || this.lock || document.visibilityState !== "visible") return;
    try{
      this.lock = await navigator.wakeLock.request("screen");
      this.lock.addEventListener("release", () => { this.lock = null; this.render(); });
    }catch(e){ this.lock = null; }
    this.render();
  },
  async release(){
    if (this.lock){ try{ await this.lock.release(); }catch(e){} this.lock = null; }
    this.render();
  },
  render(){
    const b = $("#wakeBtn");
    b.hidden = !(this.supported && this.active);
    const on = !!this.lock;
    b.setAttribute("aria-pressed", String(on));
    $("#wakeLabel").textContent = on ? "Screen on" : "Screen off";
    b.title = on ? "The screen stays on. Tap to allow sleep." : "Tap to keep the screen on while cooking";
  }

function matches(r){
  // Diet chips (veg / meat / seafood) combine with OR; "quick" must also hold when it's on.
  const diets = [...state.tags].filter(t => t !== "quick");
  if (diets.length && !diets.some(t => r.tags.includes(t))) return null;
  if (state.tags.has("quick") && !r.tags.includes("quick")) return null;
  if (!state.q) return {hit:null};
  const q = norm(state.q);
  const hay = norm([r.title, r.sub || "", r.cuisine || ""].join(" "));
  if (hay.includes(q)) return {hit:null};
  for (const g of r.ingredients) for (const i of g.items){
    const s = [i.n, i.l || ""].join(" ");
    if (norm(s).includes(q)) return {hit:i.n};
  }
  return null;
}
function highlight(text, q){
  if (!q) return esc(text);
  const n = norm(text), k = norm(q), i = n.indexOf(k);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}

let secObserverHandler = null;
const PROGRESS_TTL_HOURS = 24;   // how long ticks and the amount setting are remembered per recipe
function recipeSig(r){            // djb2 hash: saved progress is dropped when the recipe changes
  let h = 5381; const str = JSON.stringify([r.ingredients, r.method]);
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);

/* ------------------------------------------------------------------
   SCALING AMOUNTS
------------------------------------------------------------------- */
/* SCALING:START */
const FRAC = {"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
const fmtK = k => String(k).replace(".5", "½").replace(/^0½$/, "½");
const trim = n => String(Math.round(n * 100) / 100);
const parseNum = s => { const m = /^(\d+(?:\.\d+)?)?([½¼¾⅓⅔⅛⅜⅝⅞])?$/.exec(String(s).trim()); return m && (m[1] || m[2]) ? (m[1] ? parseFloat(m[1]) : 0) + (m[2] ? FRAC[m[2]] : 0) : NaN; };

// Nearest kitchen fraction (eighths and thirds). A non-zero amount never becomes 0.
function toFraction(v){
  if (!(v > 0)) return "0";
  const opts = [[0,""],[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[2/3,"⅔"],[.75,"¾"],[.875,"⅞"],[1,""]];
  let w = Math.floor(v), f = v - w, best = opts[0];
  opts.forEach(o => { if (Math.abs(f - o[0]) < Math.abs(f - best[0])) best = o; });
  if (best[0] === 1){ w += 1; best = opts[0]; }
  if (w === 0 && !best[1]) return "⅛";
  return w === 0 ? best[1] : `${w}${best[1]}`;
}

// Metric display. Never shows 0 for a non-zero amount.
function fmtMetric(v, unit){
  if (unit === "l" || unit === "kg") return trim(v);
  if (v >= 1000) return null;                      // caller switches to l / kg
  if (v >= 100) return String(Math.round(v / 5) * 5);
  if (v >= 10) return String(Math.round(v));
  if (v >= 1) return String(Math.round(v * 2) / 2);
  return String(Math.max(0.1, Math.round(v * 10) / 10));
}

// Re-express a single US volume (given in teaspoons) with real measuring cups and spoons.
function spoons(t, us){
  const cupWord = c => `${us ? "US " : ""}${c > 1 ? "cups" : "cup"}`;
  const CUPF = [0, 1/4, 1/3, 1/2, 2/3, 3/4];
  if (t < 0.1) return "1 pinch";
  if (t < 3 - 1e-9){
    const q = t < 1 ? Math.max(1/8, Math.round(t * 8) / 8) : Math.round(t * 4) / 4;
    if (q < 3) return `${toFraction(q)} tsp`;
  }
  const c = t / 48;
  const plainCup = () => {               // a single cup measure within 2 %
    let best = null;
    for (let w = Math.floor(c); w <= Math.floor(c) + 1; w++) for (const f of CUPF){
      const cv = w + f; if (cv <= 0) continue;
      if (Math.abs(cv - c) / c <= 0.02 && (!best || Math.abs(cv - c) < Math.abs(best - c))) best = cv;
    }
    return best;
  };
  const tbspText = () => {               // half-tablespoon steps, else tbsp + tsp
    const half = Math.round(t / 3 * 2) / 2;
    if (half >= 1 && Math.abs(half * 3 - t) <= 0.26) return `${toFraction(half)} tbsp`;
    const w = Math.floor(t / 3), rem = Math.round((t - w * 3) * 4) / 4;
    if (rem >= 3) return `${w + 1} tbsp`;
    return rem ? `${w} tbsp + ${toFraction(rem)} tsp` : `${w} tbsp`;
  };
  if (t < 12 - 1e-9) return tbspText();
  const pc = plainCup();
  if (pc) return `${toFraction(pc)} ${cupWord(pc)}`;
  if (t < 24 && Math.abs(Math.round(t / 1.5) * 1.5 - t) <= 0.26) return tbspText();
  let best = null;                        // cup measure + whole tablespoons, closest wins
  for (let w = Math.floor(c); w >= Math.max(0, Math.floor(c) - 1); w--) for (const f of CUPF){
    const cv = w + f; if (cv <= 0 || cv > c + 1e-9) continue;
    const r = Math.round((c - cv) * 16); if (r > 3) continue;
    const err = Math.abs(cv + r / 16 - c);
    if (!best || err < best.err - 1e-9 || (Math.abs(err - best.err) < 1e-9 && r < best.r)) best = {cv, r, err};
  }
  if (!best){                             // just short of a cup measure: use the nearest one
    let near = 1/4;
    for (let w = Math.floor(c); w <= Math.floor(c) + 1; w++) for (const f of CUPF){ const cv = w + f; if (cv > 0 && Math.abs(cv - c) < Math.abs(near - c)) near = cv; }
    return `${toFraction(near)} ${cupWord(near)}`;
  }
  return `${toFraction(best.cv)} ${cupWord(best.cv)}` + (best.r ? ` + ${best.r} tbsp` : "");
}

const PLURALS = [["grind","grinds"],["clove","cloves"],["slice","slices"],["head","heads"],["handful","handfuls"],
  ["pinch","pinches"],["portion","portions"],["layer","layers"],["sheet","sheets"],["egg","eggs"],["cup","cups"],
  ["taza","tazas"],["cucharada","cucharadas"],["cucchiaio","cucchiai"]];
function fixPlurals(str){
  return str.replace(/(\d+(?:\.\d+)?[½¼¾⅓⅔⅛⅜⅝⅞]?|[½¼¾⅓⅔⅛⅜⅝⅞])(\s+)((?:US\s+)?)([A-Za-zÀ-ÿ]+)(\s*\((?:cups?)\))?/g,
    (m, n, sp, us, word, gloss) => {
      const pair = PLURALS.find(p => p.includes(word.toLowerCase()));
      if (!pair) return m;
      const many = parseNum(n) > 1;
      const w = many ? pair[1] : pair[0];
      const g = gloss ? gloss.replace(/cups?/, many ? "cups" : "cup") : "";
      return n + sp + us + (word[0] === word[0].toUpperCase() ? w[0].toUpperCase() + w.slice(1) : w) + g;
    });
}

function scaleQty(str, k){
  if (k === 1 || !str) return str;
  // "4 × 115–170 g": scale the count only, the size of each piece stays.
  const mult = /^(\D*?)(\d+(?:\.\d+)?|[½¼¾⅓⅔⅛⅜⅝⅞])\s*×\s*(.+)$/.exec(str);
  if (mult) return `${mult[1]}${toFraction(parseNum(mult[2]) * k)} × ${mult[3]}`;
  if (/\bcans?\b/.test(str)) return `${fmtK(k)} × ${str}`;              // keep can sizes intact
  // A US volume such as "about ¼ cup", "2 tbsp" or "¾ US cup + 1 tbsp": re-express with real measures.
  const lead = /^((?:about|≈|~)\s*)?(.*)$/.exec(str.trim());
  const TERM = /^(\d+(?:\.\d+)?[½¼¾⅓⅔⅛⅜⅝⅞]?|[½¼¾⅓⅔⅛⅜⅝⅞])\s*(US\s+)?(tsp|teaspoons?|tbsp|tablespoons?|cups?)$/i;
  const terms = lead[2].split(/\s*\+\s*/).map(s => TERM.exec(s));
  if (terms.every(Boolean)){
    let tsp = 0, us = false;
    terms.forEach(t => { tsp += parseNum(t[1]) * (/^t(sp|easpoon)/i.test(t[3]) ? 1 : /^(tbsp|tablespoon)/i.test(t[3]) ? 3 : 48); us = us || !!t[2]; });
    return (lead[1] || "") + spoons(tsp * k, us);
  }
  const keep = [];
  str = str.replace(/\([^)]*\beach\b[^)]*\)/g, m => { keep.push(m); return `\u0000${keep.length - 1}\u0000`; });
  str = str.replace(/(\d+(?:\.\d+)?)?([½¼¾⅓⅔⅛⅜⅝⅞])?(?=(\s*[^\d\s½¼¾⅓⅔⅛⅜⅝⅞]*))/g, (m, num, fr, after, off, whole) => {
    if (!num && !fr) return m;
    const unit = (whole.slice(off + m.length).replace(/^\s*–\s*[\d.½¼¾⅓⅔⅛⅜⅝⅞]+/, "").match(/^\s*([^\s\d)–,]*)/) || ["",""])[1].toLowerCase();
    if (/^(°|%|cm|mm|-?inch|in$|x$|″)/.test(unit)) return m;
    const v = (num ? parseFloat(num) : 0) + (fr ? FRAC[fr] : 0);
    const out = v * k;
    if (!/^(g|kg|ml|l)$/.test(unit)) return toFraction(out);
    const f = fmtMetric(out, unit);
    const inRange = /^\s*–/.test(whole.slice(off + m.length)) || /–\s*$/.test(whole.slice(0, off));
    if (f === null && inRange) return String(Math.round(out / 5) * 5);
    return f === null ? trim(out / 1000) + "\u0001" : f;
  });
  str = str.replace(/\u0001\s*(g|ml)\b/g, (_, u) => " " + (u === "g" ? "kg" : "l"));
  str = str.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
  return fixPlurals(str);
}
/* SCALING:END */

function ingredientRow(i, lang, idx){
  const q = i.m || i.o
    ? (i.o
        ? `<span class="q"><span class="m" data-raw="${esc(i.o)}">${esc(i.o)}</span><span class="o" data-raw="${esc(i.m || "")}">${esc(i.m || "")}</span></span>`

    : "";
  return `<li role="checkbox" aria-checked="false" tabindex="0" data-i="${idx}"><span class="box" aria-hidden="true"></span><span class="body">${q}<span class="name">${esc(i.n)}${i.x ? `<span class="x">, ${esc(i.x)}</span>` : ""}</span>${i.l ? `<span class="l" lang="${lang}">${esc(i.l)}</span>` : ""}</span></li>`;
}

        ${showOrig ? `<p class="legend"><span><b>Bold</b> original measurement</span><span>Grey: metric conversion</span></p>` : ""}
        <div class="scaler" role="group" aria-label="Adjust amounts">

      ${showOrig ? `<p class="conv">Metric values for US and other non-metric units are converted, and approximate: 1 cup = 240 ml, 1 tbsp = 15 ml, 1 tsp = 5 ml, 1 lb = 450 g, 1 oz = 28 g, 1 inch = 2.5 cm. Weights marked ≈ depend on how the cup or spoon is filled.</p>` : ""}
      <nav class="pager" aria-label="Other recipes">

      </nav>
    </div>`;

  // remembered progress (ticks + amount setting), per recipe, for PROGRESS_TTL_HOURS

  const rows = sel => [...el.querySelectorAll(sel)];

  const setTicks = (ing, steps) => {

  // scale amounts
  let k = 1;
  const saved = store.get(pKey, null);
  let restored = false;
  if (saved && (saved.sig !== sig || !(Date.now() - saved.t < PROGRESS_TTL_HOURS * 3600e3))) store.del(pKey);
  else if (saved){
    if (saved.k >= 0.5 && saved.k <= 10) k = saved.k;
    setTicks(saved.ing || [], saved.steps || []);
    restored = (saved.ing || []).length + (saved.steps || []).length > 0;
  }
  const applyScale = () => {
    el.querySelectorAll("[data-raw]").forEach(n => { n.textContent = scaleQty(n.dataset.raw, k); });
    $("#scVal").textContent = "×" + fmtK(k);
    $("#scDown").disabled = k <= 0.5;
    $("#scUp").disabled = k >= 10;
    $("#scReset").hidden = $("#scNote").hidden = k === 1;
    el.classList.toggle("scaled", k !== 1);
  };
  $("#scDown").addEventListener("click", () => { k = Math.max(0.5, k - 0.5); applyScale(); saveProgress(); });
  $("#scUp").addEventListener("click", () => { k = Math.min(10, k + 0.5); applyScale(); saveProgress(); });
  $("#scReset").addEventListener("click", () => { k = 1; applyScale(); saveProgress(); });
  applyScale();
  syncClear();
  if (restored) toast("Picked up where you left off");

  $("#clrBtn").addEventListener("click", () => {
    const prev = {ing: ticked(".ing li"), steps: ticked(".steps li")};
    setTicks([], []); saveProgress();
    toast("Ticks cleared", {label: "Undo", fn: () => { setTicks(prev.ing, prev.steps); saveProgress(); }});
  });

  el.querySelectorAll(".ph").forEach(b => b.addEventListener("click", () => { $("#lbImg").src = b.dataset.src; $("#lb").hidden = false; }));

  // tick off ingredients and steps
  el.querySelectorAll('[role="checkbox"]').forEach(li => {
    const toggle = () => {
      const on = li.classList.toggle("done");
      li.setAttribute("aria-checked", String(on));
      saveProgress();
    };
    li.addEventListener("click", e => { if (e.target.closest("a")) return; toggle(); });
    li.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); } });
  });

  // section tabs
  const tabs = [...el.querySelectorAll(".tab")];
  tabs.forEach(t => t.addEventListener("click", () => {
    scrollToEl(document.getElementById(t.dataset.target), [$(".appbar"), $("#tabs")]);
  }));
  const secs = tabs.map(t => document.getElementById(t.dataset.target));
  const titleEl = $("#rTitle");
  secObserverHandler = () => {
    const line = $(".appbar").offsetHeight + $("#tabs").offsetHeight + 24;
    let cur = 0;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= line) cur = i; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs.length - 1;
    tabs.forEach((t, i) => t.setAttribute("aria-current", String(i === cur)));
    const on = titleEl.getBoundingClientRect().bottom < $(".appbar").offsetHeight;
    $("#barTitle").classList.toggle("show", on);
    document.documentElement.classList.toggle("title-on", on);
  };
  window.addEventListener("scroll", secObserverHandler, {passive:true});
  secObserverHandler();

  $("#barTitle").textContent = r.title;
  document.title = `${r.title} | Recipe Book`;
}
function countStepsBefore(r, group){
  let n = 0;
  for (const g of r.method){
    if (g.alt) n = 0;            // an alternative method restarts the numbering
    if (g === group) break;
    n += g.steps.length;
  }
  return n;
}

/* ------------------------------------------------------------------
   ROUTER
------------------------------------------------------------------- */
let current = "overview";
function route(){
  const m = /^#\/r\/([\w-]+)/.exec(location.hash);
  const r = m && RECIPES.find(x => x.id === m[1]);
  if (secObserverHandler){ window.removeEventListener("scroll", secObserverHandler); secObserverHandler = null; }

  if (r){
    if (current === "overview") overviewScroll = window.scrollY;
    current = "recipe";
    $("#overview").hidden = true;
    $("#recipe").hidden = false;
    $("#brand").hidden = true;
    $("#back").hidden = false;
    $("#spacer").hidden = true;
    renderRecipe(r);
    window.scrollTo(0, 0);
    wake.active = true; wake.acquire(); wake.render();
  } else {
    const wasRecipe = current === "recipe";
    current = "overview";
    $("#recipe").hidden = true; $("#recipe").innerHTML = "";
    $("#overview").hidden = false;
    $("#brand").hidden = false;
    $("#back").hidden = true;
    $("#spacer").hidden = false;
    $("#barTitle").classList.remove("show"); $("#barTitle").textContent = ""; document.documentElement.classList.remove("title-on");
    document.title = "Recipe Book";
    wake.active = false; wake.release();
    window.scrollTo(0, wasRecipe ? overviewScroll : 0);
  }
}
window.addEventListener("hashchange", route);

buildFilters();
renderList();
route();
document.body.insertAdjacentHTML("beforeend", `<div class="lb" id="lb" hidden><img id="lbImg" alt=""><button type="button" class="lb-x" aria-label="Close">✕</button></div>`);
$("#lb").addEventListener("click", () => { $("#lb").hidden = true; });
</script>
</body>
